name: Storefront Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check ugc/app.js
          for f in api/*.js api/_lib/*.js; do node --check "$f"; done
      - name: Run storefront smoke test
        run: python scripts/smoke-test.py
