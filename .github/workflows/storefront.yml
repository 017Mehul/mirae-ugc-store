name: Storefront Checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript
        run: |
          node --check ugc/app.js
          node --check api/products.js
          node --check api/newsletter.js
          node --check api/contact.js
          node --check api/checkout.js
          node --check api/config.js
          node --check api/orders.js
          node --check api/_lib/supabase.js
          node --check scripts/smoke-test.js
      - name: Run storefront smoke test
        run: node scripts/smoke-test.js
